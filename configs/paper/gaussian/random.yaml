# Paper design; CUDA is required for the original random streams.
# Labels, master seed, budgets, pilot fraction, and adaptive degree rule are preserved.
master_seed: 20260812
backend: cupy
gpu:
  device: 0
  sample_batch_size: 5000
  synchronize_timing: true
experiment:
  dimensions:
  - 200
  - 300
  - 400
  - 600
  - 900
  - 1200
  - 1600
  - 2048
  - 2500
  - 3000
  sample_budgets:
  - 50000
  - 60000
  - 80000
  - 100000
  methods:
  - empirical_plugin
  - fid_infinity_ols_order1
  - fid_infinity_ols_order2
  - fid_infinity_ols_order3
  - general_adaptive
  known_zero_mean: true
  nested_sample_prefixes: true
  m0_fraction_numerator: 4
  m0_fraction_denominator: 5
covariance_cases:
- suite: average
  family: haar_log_uniform
  case_label: haar_log_uniform
  num_instances: 10
  num_trials: 5
  parameters:
    lambda_min: 0.05
    lambda_max: 1.0
- suite: average
  family: spiked_bulk
  case_label: spiked_bulk
  num_instances: 10
  num_trials: 5
  parameters:
    spike_fraction: 0.1
    bulk_min: 0.1
    bulk_max: 0.3
    spike_min: 0.7
    spike_max: 1.0
- suite: average
  family: rotated_toeplitz
  case_label: rotated_toeplitz
  num_instances: 10
  num_trials: 5
  parameters:
    rho_a: 0.4
    rho_b: 0.7
    operator_norm: 1.0
fid_infinity:
  minimum_samples: 5000
  num_points: 15
  regression_orders:
  - 1
  - 2
  - 3
  regression_weightings:
  - ordinary_ols
general_order:
  rho_design: 0.25
  C_T: 1.0
  degree_cap: null
  compensated_sum: true
numerics:
  eig_rtol: 1.0e-10
  eig_atol: 1.0e-12
output:
  directory: outputs/gaussian_random
