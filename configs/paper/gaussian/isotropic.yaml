# Paper design; CUDA is required for the original random streams.
# Labels, master seed, budgets, pilot fraction, and adaptive degree rule are preserved.
master_seed: 20260913
backend: cupy
gpu:
  device: 0
  sample_batch_size: 5000
  synchronize_timing: true
experiment:
  dimensions:
  - 5000
  sample_budgets:
  - 100000
  known_zero_mean: true
  nested_sample_prefixes: true
  m0_fraction_numerator: 4
  m0_fraction_denominator: 5
  methods:
  - empirical_plugin
  - fid_infinity_ols_order1
  - fid_infinity_ols_order2
  - fid_infinity_ols_order3
  - general_adaptive
covariance_cases:
- suite: stress
  family: isotropic
  case_label: section6_isotropic_b05_D5
  num_instances: 1
  num_trials: 50
  parameters:
    target_w2_sq: 5.0
    generated_scale: 0.5
fid_infinity:
  minimum_samples: 5000
  num_points: 15
  regression_orders:
  - 1
  - 2
  - 3
  regression_weightings:
  - ordinary_ols
general_order:
  rho_design: 0.25
  C_T: 1.0
  degree_cap: null
  compensated_sum: true
numerics:
  eig_rtol: 1.0e-10
  eig_atol: 1.0e-12
output:
  directory: outputs/gaussian_isotropic
